name: Instagram news bot

on:
  workflow_dispatch:
  schedule:
    - cron: "40 15 * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instagram-news-publisher
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements.txt

      - name: Build carousel images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python run_bot.py --dry-run > carousel.json

      - name: Verify images were generated
        run: |
          test -n "$(find site/media -maxdepth 1 -type f -name '*.jpg' -print -quit)" || {
            echo "No carousel JPG files were generated" >&2
            exit 1
          }
          find site/media -maxdepth 1 -type f -name '*.jpg' -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify images are available on Pages
        env:
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          base = os.environ["PAGES_BASE_URL"].rstrip("/")
          images = sorted(pathlib.Path("site/media").glob("*.jpg"))
          if not images:
              raise SystemExit("No generated JPG images found")
          for image in images:
              url = f"{base}/media/{image.name}"
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(url, method="HEAD")
                      with urllib.request.urlopen(request, timeout=20) as response:
                          content_type = response.headers.get("Content-Type", "")
                          if response.status == 200 and content_type.startswith("image/"):
                              print(f"OK {url} ({content_type})")
                              break
                          raise RuntimeError(f"Unexpected response {response.status} {content_type}")
                  except (urllib.error.URLError, TimeoutError, RuntimeError) as error:
                      if attempt == 11:
                          raise SystemExit(f"Pages image not ready: {url}: {error}")
                      time.sleep(10)
          PY

      - name: Publish carousel to Instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          from src.instagram import publish_carousel

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/")
          raw = Path("carousel.json").read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          offset = 0
          posted_path = Path("state/posted.json")
          posted = json.loads(posted_path.read_text(encoding="utf-8"))
          count = 0

          while offset < len(raw):
              while offset < len(raw) and raw[offset].isspace():
                  offset += 1
              if offset >= len(raw):
                  break
              entry, offset = decoder.raw_decode(raw, offset)
              news = entry["news"]
              carousel = entry["carousel"]
              caption = f"{carousel['caption']}\n\nИсточник: {news['source']} — {news['link']}"
              hashtags = " ".join(f"#{tag}" for tag in carousel["hashtags"])
              if hashtags:
                  caption += f"\n\n{hashtags}"

              media_id = publish_carousel(entry["files"], caption, base_url)
              posted.append({
                  "id": news["id"],
                  "link": news["link"],
                  "title": news["title"],
                  "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "instagram_media_id": media_id,
              })
              print(f"Опубликовано: {news['title']} (Instagram ID {media_id})")
              count += 1

          if count == 0:
              raise SystemExit("В carousel.json нет подготовленных каруселей")
          posted_path.write_text(
              json.dumps(posted[-500:], ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save duplicate prevention state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || git commit -m "Update published news state"
          git push
